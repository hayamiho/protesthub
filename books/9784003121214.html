<body>

    <header class="topbar">

    <div class="modal" id="modal" style="display: grid;">
        <div class="modal-panel">
            <button class="close-btn" id="close-btn" type="button" aria-label="閉じる"
                onclick="location.href='index.html'">×</button>

            <div class="modal-left">
                <div class="modal-cover-wrap">
                    <img src="images/9784003121214.webp" alt="二十四の瞳" onerror="this.src='../images/logo.png';">
                </div>
                <div class="modal-left-actions">
                    <button class="button share-btn-x" id="share-x-btn" type="button">
                        #反戦読書部 ＋書名でシェア
                    </button>
                    <a class="amazon-text-link" href="https://amzn.to/4A9zUA1" target="_blank" rel="noopener noreferrer">
                        Amazonで詳細を見る ↗
                    </a>
                </div>
            </div>

            <div class="modal-right">
                <div class="modal-header-info">
                    <h2 class="modal-title">二十四の瞳</h2>
                    <div class="modal-meta-single">壺井 栄(著) ／ 岩波書店</div>
                </div>

                <div class="modal-content-body">
                    <div class="description-inline-wrap" id="description-wrap">
                        <p class="modal-description-text clamp-1" id="modal-description">海辺の寒村に、女子師範学校出の大石先生が赴任してきた。担当する分教場の小学一年生は十二人。新米先生は、様々な家庭の事情を抱えた生徒たちを慈愛に満ちた眼差しで導き、時と場所を越えた師弟関係を築いていく。やがて戦争、そして敗戦。自らも苦渋の季節を経て、四十になった先生は、再び分教場の教壇に立ち、昔の教え子の子どもたちと出会う。真の師弟愛を描いた不朽の名作。</p>
                        <button class="read-more-btn" id="read-more-btn" type="button">▼ 続きを読む</button>
                    </div>

                    <div class="modal-tweets-container" id="modal-tweets">
                        <div class="tweet-embed-item" data-tweet-id="2078799948074852796" data-tweet-url="https://x.com/LTS26907449/status/2078799948074852796"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 背景クリックまたは閉じるボタンで一覧へ戻る
        const modalEl = document.getElementById('modal');
        if (modalEl) {
            modalEl.addEventListener('click', (e) => {
                if (e.target === modalEl) {
                    location.href = 'index.html';
                }
            });
        }

        // シェアボタンの挙動
        const shareBtn = document.getElementById('share-x-btn');
        if (shareBtn) {
            shareBtn.onclick = () => {
                const pageUrl = `https://protesthub.jp/books/9784003121214.html`;
                const shareText = `『二十四の瞳』\n#反戦読書部\n${pageUrl}`;
                const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
                window.open(xUrl, '_blank', 'noopener,noreferrer');
            };
        }

        // 紹介文の「続きを読む」展開・折りたたみ
        const descText = document.getElementById('modal-description');
        const readMoreBtn = document.getElementById('read-more-btn');
        const descWrap = document.getElementById('description-wrap');

        if (descText && descText.textContent.trim()) {
            readMoreBtn.onclick = () => {
                if (descText.classList.contains('clamp-1')) {
                    descText.classList.remove('clamp-1');
                    readMoreBtn.textContent = '▲ 閉じる';
                } else {
                    descText.classList.add('clamp-1');
                    readMoreBtn.textContent = '▼ 続きを読む';
                }
            };
        } else if (descWrap) {
            descWrap.style.display = 'none';
        }

        // IntersectionObserver によるスクロール遅延エンベッド
        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const wrapper = entry.target;
                        if (wrapper.dataset.loaded) return;
                        wrapper.dataset.loaded = 'true';

                        const tweetId = wrapper.dataset.tweetId;

                        const renderTweet = () => {
                            if (tweetId && window.twttr && window.twttr.widgets) {
                                window.twttr.widgets.createTweet(tweetId, wrapper, {
                                    theme: 'light',
                                    conversation: 'none',
                                    dnt: true
                                });
                            }
                        };

                        if (window.twttr && window.twttr.widgets) {
                            renderTweet();
                        } else {
                            const checkInterval = setInterval(() => {
                                if (window.twttr && window.twttr.widgets) {
                                    clearInterval(checkInterval);
                                    renderTweet();
                                }
                            }, 50);
                        }
                        obs.unobserve(wrapper);
                    }
                });
            }, { rootMargin: '300px 0px', threshold: 0.01 });

            document.querySelectorAll('.tweet-embed-item').forEach(item => observer.observe(item));
        }
    </script>
