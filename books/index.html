<!doctype html>
<html lang="ja">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EPR12YHXZH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-EPR12YHXZH');
    </script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProtestHub / Books</title>
    <meta name="description" content="プロテスターの参考図書・反戦読書部で共有された書籍ギャラリー。">

    <!-- Google Fonts: Jaro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">

    <!-- OGP -->
    <meta property="og:site_name" content="Protest Hub Books">
    <meta property="og:title" content="ProtestHub / Books">
    <meta property="og:description" content="プロテスターの参考図書・反戦読書部で共有された書籍ギャラリー。">
    <meta property="og:url" content="https://www.protesthub.jp/books/index.html">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.protesthub.jp/images/ogp20260611.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@protesthub_jp">
    <meta name="twitter:title" content="ProtestHub / Books">
    <meta name="twitter:description" content="プロテスターの参考図書・反戦読書部で共有された書籍ギャラリー。">

    <link rel="icon" href="../favicon.png" type="image/png">
    <link rel="stylesheet" href="books.css">

    <!-- X / Twitter Widgets SDK for Tweet Embedding -->
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <!-- ヘッダーブランド＆ナビゲーション（スマホ時はロゴの下で改行） -->
            <div class="brand-wrap">
                <a class="brand" href="index.html" aria-label="ProtestHub Home">
                    <img class="brand-logo" src="../images/logo.png" alt="ProtestHub">
                </a>
                <nav class="header-nav">
                    <a class="nav-btn active" href="index.html">Books</a>
                    <a class="nav-btn" href="../design/index.html">Design</a>
                    <a class="nav-btn" href="../about.html">初めての方へ</a>
                </nav>
            </div>

            <!-- 検索＆ソート（デフォルト: ランダム） -->
            <div class="tools" aria-label="書籍検索">
                <input class="search" id="search" type="search" placeholder="書名・著者名で検索..." autocomplete="off">
                <select class="select" id="sort" aria-label="並べ替え">
                    <option value="random" selected>ランダム</option>
                    <option value="newest">新着順</option>
                    <option value="title">タイトル順</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- お知らせエリア（news.html から自動読込） -->
        <div id="news-area"></div>

        <!-- 書影ウォール（枠なし・自然高さの極めてシンプルなデザインウォール） -->
        <div class="book-wall" id="book-wall" aria-label="書籍一覧"></div>
    </main>

    <!-- 詳細モーダル -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-panel">
            <button class="close-btn" id="close-btn" type="button" aria-label="閉じる">×</button>

            <div class="modal-left">
                <div class="modal-cover-wrap">
                    <img id="modal-cover" src="" alt="書影">
                </div>
                <div class="modal-left-actions">
                    <button class="button share-btn-x" id="modal-share-x" type="button">
                        #反戦読書部 ＋書名でシェア
                    </button>
                    <a class="amazon-text-link" id="modal-amazon-link" href="#" target="_blank"
                        rel="noopener noreferrer">
                        Amazonで詳細を見る ↗
                    </a>
                </div>
            </div>

            <div class="modal-right">
                <div class="modal-header-info">
                    <h2 class="modal-title" id="modal-title"></h2>
                    <!-- 1行表示：著者 ／ 出版社 -->
                    <div class="modal-meta-single" id="modal-meta"></div>
                </div>

                <div class="modal-content-body">
                    <!-- 紹介文（1行表示 ＋ 右寄せ▼続きを読む） -->
                    <div class="description-inline-wrap" id="description-wrap">
                        <p class="modal-description-text clamp-1" id="modal-description"></p>
                        <button class="read-more-btn" id="read-more-btn" type="button">▼ 続きを読む</button>
                    </div>

                    <!-- 関連ポスト群（最優先・X公式埋め込み表示・縦スクロール対応） -->
                    <div class="modal-tweets-container" id="modal-tweets"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="data_books.js"></script>
    <script src="books.js"></script>
</body>

</html>
