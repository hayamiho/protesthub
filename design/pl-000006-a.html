    <style>
        :root {
            color-scheme: light;
            --ink: #201916;
            --muted: #695f59;
            --paper: #f7f0e4;
            --sheet: #fffaf1;
            --line: #ded0c0;
            --yellow: #f4c915;
            --teal: #31ada3;
            --red: #df594d;
            --shadow: 0 14px 42px rgba(38, 27, 19, .13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
            background:
                linear-gradient(90deg, rgba(32, 25, 22, .035) 1px, transparent 1px) 0 0 / 28px 28px,
                linear-gradient(0deg, rgba(32, 25, 22, .028) 1px, transparent 1px) 0 0 / 28px 28px,
                var(--paper);
            color: var(--ink);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid rgba(32, 25, 22, .12);
            background: rgba(247, 240, 228, .86);
            backdrop-filter: blur(16px);
        }

        .topbar-inner {
            width: calc(100% - 18px);
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 auto;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-family: "Arial Black", sans-serif;
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
        }

        .brand-logo {
            height: 38px;
        }

        .container {
            display: grid;
            place-items: center;
            padding: 24px 12px;
        }

        .panel {
            position: relative;
            width: min(1200px, 100%);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            border: 3px solid var(--ink);
            border-radius: 8px;
            background: var(--sheet);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .art {
            display: grid;
            place-items: center;
            background: #efe7da;
            padding: 20px;
        }

        .art img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .side {
            padding: 24px;
            border-left: 3px solid var(--ink);
            display: grid;
            gap: 16px;
            align-content: start;
        }

        .title {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
        }

        .file {
            font-size: 14px;
            color: var(--muted);
            margin: 0;
        }

        .tag {
            display: inline-flex;
            padding: 4px 8px;
            border: 1px solid var(--line);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 800;
        }

        .desc {
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .creator-wrap {
            display: flex;
            gap: 4px;
            align-items: center;
            font-size: 13px;
            font-weight: 900;
        }

        .creator-link {
            color: var(--ink);
            text-decoration: underline;
        }

        .rights {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(255, 250, 241, .78);
            font-size: 12px;
        }

        .rights-text {
            margin: 0 0 4px;
            color: var(--muted);
        }

        .agree {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            border: 2px solid var(--ink);
            border-radius: 6px;
            background: var(--ink);
            color: #fff;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }

        .button.secondary {
            background: #fff;
            color: var(--ink);
        }

        .button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .actions {
            display: grid;
            gap: 10px;
        }

        .share-actions {
            margin-top: 8px;
            display: flex;
            gap: 12px;
        }

        .netprint-links {
            margin-top: 4px;
            display: grid;
            gap: 2px;
            font-size: 13px;
        }

        .netprint-title {
            font-weight: 800;
            color: var(--muted);
        }

        .netprint-link-item {
            display: flex;
            gap: 2px;
            font-weight: 800;
        }

        .netprint-bullet {
            color: var(--ink);
        }

        .netprint-link {
            color: var(--ink);
            text-decoration: underline;
        }

        .share-actions {
            display: flex;
            gap: 12px;
        }

        .share-icon {
            width: 32px;
            height: 32px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            font-weight: 800;
            text-decoration: none;
            font-size: 14px;
        }

        .section-title {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 800;
        }

        .variant-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: flex-start;
        }

        .variant-thumb {
            width: 72px;
            height: auto;
            border: 2px solid var(--ink);
            border-radius: 6px;
            cursor: pointer;
            background: var(--sheet);
            transition: transform 0.1s;
        }

        .variant-thumb:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 800px) {
            .panel {
                grid-template-columns: 1fr;
            }

            .side {
                border-left: 0;
                border-top: 3px solid var(--ink);
            }

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="index.html">
                <img class="brand-logo" src="../images/logo.png" alt="ProtestHub">
            </a>
        </div>
    </header>

    <main class="container">
        <div style="width: min(1200px, 100%);">
            <a href="index.html" class="back-link">← デザイン一覧に戻る</a>
            <div class="panel">
                <div class="art">
                    <img src="images/pl-000006-a.png" alt="国旗損壊罪 いらない！">
                </div>
                <aside class="side">
                    <h1 class="title">国旗損壊罪 いらない！</h1>
                    <p class="file">pl-000006-a.png</p>
                    <div><span class="tag">政治 / 国旗損壊罪 / 横 / 政治</span></div>
                    <p class="desc">4200×2970px　A3/A4兼用</p>

                    <div class="creator-wrap">
                        <span>制作：</span>
                        <a class="creator-link" href="https://x.com/protesthub_jp" target="_blank" rel="noopener">protesthub_jp</a>

                    <div class="rights">
                        <p class="rights-text">・著作権は制作者様に帰属しています</p>
                        <p class="rights-text">・改変/転載/商用利用/AI学習いずれも不可</p>
                        <label class="agree">
                            <input id="rights-agree" type="checkbox">
                            <span>上記2点に同意します</span>
                        </label>
                    </div>

                    <div class="actions">
                        <button class="button" id="download" disabled>ダウンロード</button>
                        <button class="button secondary" id="print" disabled>印刷</button>
                    </div>

                    <div class="netprint-links">
                        <span class="netprint-title">ネットプリント登録</span>
                        <div class="netprint-link-item">
                            <span class="netprint-bullet">・</span>
                            <a href="https://www.printing.ne.jp/" target="_blank" rel="noopener"
                                class="netprint-link">セブンイレブン</a>
                        </div>
                        <div class="netprint-link-item">
                            <span class="netprint-bullet">・</span>
                            <a href="https://networkprint.ne.jp/sharp_netprint/ja/top.aspx" target="_blank"
                                rel="noopener" class="netprint-link">ファミマ/ローソン/ミニストップ/ポプラ</a>
                        </div>
                    </div>

                    <div class="share-actions">
                        <a href="#" id="share-x" target="_blank" class="share-button">
                            <img src="../images/icon_x.png" alt="X" class="share-icon">
                        </a>
                        <a href="#" id="share-fb" target="_blank" class="share-button">
                            <img src="../images/icon_fb.png" alt="FB" class="share-icon">
                        </a>
                    </div>

                    <div id="variants-section" style="display: none;">
                        <strong class="section-title">バリエーション</strong>
                        <div class="variant-list" id="variant-list"></div>
                    </div>

                    <div id="author-section" style="display: none;">
                        <strong class="section-title" id="author-title">作者の他作品</strong>
                        <div class="variant-list" id="author-list"></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script src="data.js"></script>
    <script>
        const currentFile = "pl-000006-a.png";
        const currentBy = "protesthub_jp";

        const agree = document.getElementById('rights-agree');
        const dlBtn = document.getElementById('download');
        const prBtn = document.getElementById('print');

        agree.onchange = () => {
            dlBtn.disabled = !agree.checked;
            prBtn.disabled = !agree.checked;
        };

        dlBtn.onclick = () => {
            const link = document.createElement('a');
            link.href = 'images/' + currentFile;
            link.download = currentFile;
            link.click();
            gtag('event', 'download', { 'event_category': 'design', 'event_label': currentFile });
        };

        prBtn.onclick = () => {
            window.print();
            gtag('event', 'print', { 'event_category': 'design', 'event_label': currentFile });
        };

        // SNS Share
        const shareUrl = location.href;
        const shareText = "国旗損壊罪 いらない！｜Protest Hub";
        document.getElementById('share-x').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
        document.getElementById('share-fb').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`;

        // Dynamic Lists
        function initLists() {
            const data = POSTERS_DATA;
            const currentId = currentFile.match(/pl-(\d{6})/)[1];

            // バリエーション
            const variants = data.filter(p => p.file.match(/pl-(\d{6})/)[1] === currentId && p.file !== currentFile);
            if (variants.length > 0) {
                const list = document.getElementById('variant-list');
                variants.forEach(v => {
                    const a = document.createElement('a');
                    a.href = v.file.replace(/\.[^/.]+$/, "") + ".html";
                    a.innerHTML = `<img src="images/${v.file}" class="variant-thumb" alt="${v.title}">`;
                    list.appendChild(a);
                });
                document.getElementById('variants-section').style.display = 'block';
            }

            // 作者の他作品
            const authorWorks = data.filter(p => p.by === currentBy && p.file.match(/pl-(\d{6})/)[1] !== currentId);
            // 重複デザイン（IDが同じもの）は1つだけ表示
            const uniqueAuthorWorks = [];
            const seenIds = new Set();
            authorWorks.forEach(p => {
                const id = p.file.match(/pl-(\d{6})/)[1];
                if (!seenIds.has(id)) {
                    uniqueAuthorWorks.push(p);
                    seenIds.add(id);
                }
            });

            if (uniqueAuthorWorks.length > 0) {
                const list = document.getElementById('author-list');
                document.getElementById('author-title').textContent = currentBy + 'の他作品';
                uniqueAuthorWorks.slice(0, 12).forEach(v => {
                    const a = document.createElement('a');
                    a.href = v.file.replace(/\.[^/.]+$/, "") + ".html";
                    a.innerHTML = `<img src="images/${v.file}" class="variant-thumb" alt="${v.title}">`;
                    list.appendChild(a);
                });
                document.getElementById('author-section').style.display = 'block';
            }
        }
        initLists();
    </script>
