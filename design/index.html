<!doctype html>
<html lang="ja">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EPR12YHXZH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-EPR12YHXZH');

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Protest Hub Design Wall</title>
    <meta name="description" content="明日すぐ使えるプラカードまとめサイト。市民プロテストを、もっと気楽にカジュアルに。">

    <!-- Google Fonts: Jaro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">

    <!-- OGP -->
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Protest Hub">
    <meta property="og:title" id="og-title" content="Protest Hub Design Wall">
    <meta property="og:description" id="og-description" content="明日すぐ使えるプラカードまとめサイト。市民プロテストを、もっと気楽にカジュアルに。">
    <meta property="og:url" id="og-url" content="https://www.protesthub.jp/design/index.html">
    <meta property="og:type" content="website">
    <meta property="og:image" id="og-image" content="https://www.protesthub.jp/images/ogp20260611.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@protesthub_jp">
    <meta name="twitter:title" id="tw-title" content="Protest Hub Design Wall">
    <meta name="twitter:description" id="tw-description" content="明日すぐ使えるプラカードまとめサイト。市民プロテストを、もっと気楽にカジュアルに。">
    <meta name="twitter:image" id="tw-image" content="https://www.protesthub.jp/images/ogp20260611.png">

    <link rel="icon" href="../favicon.png" type="image/png">
    <link rel="stylesheet" href="design.css">
</head>

<body>

    <header class="topbar">
        <div class="topbar-inner">
            <!-- ヘッダーブランド＆ナビゲーション -->
            <div class="brand-wrap">
                <a class="brand" href="../index.html" aria-label="ProtestHub Home">
                    <img class="brand-logo" src="../images/logo.png" alt="ProtestHub">
                </a>
                <nav class="header-nav">
                    <a class="nav-btn" href="../books/index.html">Books</a>
                    <a class="nav-btn active" href="index.html">Design</a>
                    <a class="nav-btn" href="../about.html">初めての方へ</a>
                </nav>
            </div>

            <!-- 検索・カテゴリ・並べ替え -->
            <div class="tools" aria-label="デザイン検索">
                <input class="search" id="search" type="search" placeholder="検索" autocomplete="off">
                <select class="select" id="category" aria-label="カテゴリ">
                    <option value="all">すべて</option>
                </select>
                <select class="select" id="sort" aria-label="並べ替え">
                    <option value="random">ランダム</option>
                    <option value="newest">新着順</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Masonryデザインウォール（枠なし・カドマルなし・自然高） -->
    <main class="container">
        <div class="design-wall" id="wall" aria-label="デザイン一覧"></div>
    </main>

    <!-- モーダル（詳細モーダル） -->
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-panel">
            <button class="close" id="close" type="button" aria-label="閉じる">×</button>

            <div class="modal-art">
                <img id="modal-image" src="" alt="">
            </div>
            <aside class="modal-side">
                <h1 class="modal-title" id="modal-title"></h1>
                <p class="modal-file" id="modal-file"></p>
                <span class="tag" id="modal-tag"></span>
                <p class="modal-description" id="modal-description"></p>
                <div class="creator-wrap">
                    <span>制作：</span>
                    <a class="creator-link" id="creator-link" href="#" target="_blank" rel="noopener">-</a>
                </div>
                <div class="rights">
                    <p class="rights-text">・著作権は制作者様に帰属しています</p>
                    <p class="rights-text">・改変/転載/商用利用/AI学習いずれも不可</p>
                    <label class="agree">
                        <input id="rights-agree" type="checkbox">
                        <span>上記2点に同意します</span>
                    </label>
                </div>
                <div class="modal-actions">
                    <button class="button" id="modal-download" type="button" disabled>ダウンロード</button>
                    <button class="button secondary" id="print" type="button" disabled>印刷</button>
                </div>
                <div class="netprint-links">
                    <span class="netprint-title">ネットプリント登録</span>
                    <div class="netprint-link-item">
                        <span class="netprint-bullet">・</span>
                        <a href="https://www.printing.ne.jp/" target="_blank" rel="noopener"
                            class="netprint-link">セブンイレブン</a>
                    </div>
                    <div class="netprint-link-item">
                        <span class="netprint-bullet">・</span>
                        <a href="https://networkprint.ne.jp/sharp_netprint/ja/top.aspx" target="_blank" rel="noopener"
                            class="netprint-link">ファミマ/ローソン/ミニストップ/ポプラ</a>
                    </div>
                </div>
                <div class="share-actions" aria-label="SNSシェア">
                    <button class="button secondary share-button" id="share-x" type="button" aria-label="Xでシェア">
                        <img class="share-icon" src="../images/icon_x.png" alt="">
                    </button>
                    <button class="button secondary share-button" id="share-facebook" type="button"
                        aria-label="Facebookでシェア">
                        <img class="share-icon" src="../images/icon_fb.png" alt="">
                    </button>
                    <button class="button secondary share-button" id="share-instagram" type="button"
                        aria-label="Instagramでシェア">
                        <img class="share-icon" src="../images/icon_ig.png" alt="">
                    </button>
                </div>
                <div>
                    <strong class="section-title">バリエーション</strong>
                    <div class="variant-list" id="variant-list"></div>
                </div>
                <div>
                    <strong class="section-title" id="author-title">他の作品</strong>
                    <div class="variant-list" id="author-list"></div>
                </div>
                <p class="share-status" id="share-status" aria-live="polite"></p>
            </aside>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="design.js"></script>
</body>

</html>
